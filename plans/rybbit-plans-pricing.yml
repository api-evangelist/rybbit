description: >-
  Rybbit offers two consumption models. The open-source edition (AGPL-3.0) is
  free to self-host for personal or business use with no event caps and no rate
  limits. Rybbit Cloud is a usage-based subscription metered by monthly
  pageviews (an "event" is a pageview or a custom event), sold through a
  pageview slider that runs 100K → 250K → 500K → 1M → 2M → 5M → 10M → 20M →
  30M → 40M → 50M → 50M+ and raises the monthly price as the volume rises. Paid
  plans start at $13/month (Standard) and $26/month (Pro) at 100K pageviews
  billed annually, with a 7-day free trial and no card charge until the trial
  ends. Enterprise is negotiated.
notes: >-
  Prices captured 2026-08-13 are the entry points of the slider at 100K monthly
  pageviews on ANNUAL billing (the page also offers monthly billing, and
  advertises "4 months free" on annual). Higher slider positions raise the
  price; Rybbit does not publish the full bracket table, so only the entry
  points are recorded. API access is a paid feature — the docs state API keys
  are not available on the Free/Basic tier.
plan_count: 5
sources:
