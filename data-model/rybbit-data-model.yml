source: >-
  Derived from the schemas and path parameters in openapi/*.yml (TrackRequest,
  Session, the {site}/{sessionId}/{userId} path hierarchy) and from the id
  fields Rybbit's own reference and MCP tool signatures require
  (organization_id, site_id, session_id, user_id, goal_id, funnel_id,
  member_id, team_id, import_id) — https://rybbit.com/docs/api/getting-started
  and https://rybbit.com/docs/mcp.
description: >-
  Rybbit's entity graph is a two-level tenancy (Organization → Site) with every
  analytics object scoped under a Site, and every event scoped under a Session.
  Identifiers are plain numeric or string ids — Rybbit uses no typed id
  prefixes, so there is no prefix column here. The only prefixed identifiers in
  the platform are credentials (rb_org_ organization API keys), not objects.
notation: >-
  relationships use has_one / has_many / belongs_to with the reference field
  name; direction is from the entity that owns the reference.
docs: https://rybbit.com/docs/api/getting-started

