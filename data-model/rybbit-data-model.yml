  - {name: Organization, key: organization_id, domain: tenancy, description: The billing and membership boundary; owns sites, members, teams and organization API keys.}
  - {name: Member, key: member_id, domain: tenancy, description: A user's membership in an organization, carrying a role (member/admin/owner) and optional per-site restrictions.}
  - {name: Team, key: team_id, domain: tenancy, description: A named subset of members with access to a named subset of sites.}
  - {name: Site, key: site_id, domain: tenancy, description: A tracked website or React Native app; the scope for every analytics query and the unit of configuration.}
  - {name: Session, key: session_id, domain: analytics, description: A visit — attribution, geography, device, entry/exit page, duration, and counts of pageviews and events.}
