  - {name: SessionReplay, key: session_id, domain: replay, description: An rrweb recording of a session, stored in object storage and replayable in the dashboard.}
  - {name: Import, key: import_id, domain: data, description: A historical data import from another analytics platform, uploaded in event batches.}
  - {name: ApiKey, key: id, domain: auth, description: 'A credential: organization-scoped (rb_org_) or personal, optionally restricted to resource:action scopes.'}
  - {name: PrivateLink, key: privateLinkKey, domain: sharing, description: An unlisted secret key that grants unauthenticated read access to a site dashboard, used by dashboard embeds.}

