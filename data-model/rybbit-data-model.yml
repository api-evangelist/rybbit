      The captured OpenAPI's TrackRequest enum lists only pageview,
      custom_event and outbound; Rybbit's current reference adds performance and
      error. Recorded here rather than edited into the spec.

identity_model:
  anonymous: >-
    A device-derived visitor id. Rybbit stores no raw visitor data — IPs are
    hashed and anonymized and user agents are hashed daily with a rotating salt.
  identified: >-
    Calling identify links an anonymous device to a customer-supplied user_id
    and merges traits. Since v2.8.0 sessions are keyed per identified user, so
    people sharing an IP and browser no longer collapse into one session.
  erasure: >-
    A single person's analytics data can be erased (GDPR), which is exposed as
    an admin/destructive operation.

storage_note: >-
  The analytical store is ClickHouse, and Rybbit exposes it directly:
  `run_query` executes read-only SQL against a site-scoped `scoped_events`
  table, with `get_query_schema` returning that table's schema. That schema is
  the authoritative low-level data model and is only reachable with a
  `sql:read` credential — it could not be captured anonymously.
