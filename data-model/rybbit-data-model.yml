  - {name: Person, key: user_id, domain: people, description: A visitor identity — an anonymous device id, or an identified user id once identify is called — carrying traits and linked devices.}
  - {name: Goal, key: goal_id, domain: conversion, description: A conversion definition (path, event, or autocapture) evaluated against sessions.}
