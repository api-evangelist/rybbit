source: >-
  Derived by binding each MCP tool in mcp/rybbit-mcp.yml to the REST operation
  it calls. The REST target of every tool is published by Rybbit itself in
  server/src/mcp/tools/*.ts (AGPL-3.0, https://github.com/rybbit-io/rybbit),
  so the tool-to-endpoint binding is high confidence; the binding to an
  operationId is only as complete as the captured OpenAPI, which covers 10 of
  the ~70 endpoints Rybbit documents at https://rybbit.com/docs/api.
description: >-
  Rybbit projects one data core through two surfaces: a REST Stats/Management
  API and a hosted MCP server. The MCP surface is currently the WIDER of the
  two in the catalog — 38 tools against 10 captured OpenAPI operations —
  because API Evangelist has only modeled part of Rybbit's documented REST
  surface (Rybbit publishes no OpenAPI of its own). Every `mcp_only` row below
  is therefore a CATALOG gap, not a Rybbit surface divergence: each names the
  real documented REST endpoint the tool calls. There is no GraphQL surface.

surfaces:
  openapi:
    files:
      - openapi/rybbit-analytics-api-openapi.yml
      - openapi/rybbit-sessions-api-openapi.yml
      - openapi/rybbit-event-tracking-api-openapi.yml
      - openapi/_original/rybbit-openapi.yml
    operations: 10
    provider_published: false
    note: >-
      Rybbit publishes no OpenAPI/Swagger document. Probed 2026-08-13:
      app.rybbit.io/openapi.json|/openapi.yaml|/swagger.json return the Next.js
      HTML shell (200), app.rybbit.io/api/openapi.json returns the Fastify JSON
      404, and no spec file exists anywhere in the public repository tree
      (2,598 paths searched). The specs above are API Evangelist models of
      Rybbit's published reference.
  graphql:
    endpoint: null
    note: Rybbit exposes no GraphQL surface.
  mcp:
    url: https://app.rybbit.io/api/mcp
    transport: Streamable HTTP
    tools: 38
    gated: true
    note: >-
      tools/list returned HTTP 401 with a Bearer challenge on 2026-08-13, so
      per-tool inputSchema could not be captured. Tool names, descriptions and
      required scopes come from Rybbit's published docs and server source.
  rest_reference: https://rybbit.com/docs/api/getting-started

