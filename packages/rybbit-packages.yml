source: >-
  https://rybbit.com/docs/sdks/web, /docs/sdks/node, /docs/sdks/react-native and
  the npm registry metadata endpoint (https://registry.npmjs.org/<pkg>), read
  2026-08-13. Registry misses recorded honestly: PyPI has no `rybbit` project
  (404), Packagist has no `rybbit/rybbit` (404), and there is no `@rybbit/mcp`
  on npm (404) — Rybbit's MCP server is remote-only, not a stdio package.
description: >-
  Rybbit publishes three first-party JavaScript/TypeScript SDKs on npm plus a
  CDN-delivered browser tracking script. All three npm packages are owned by the
  rybbit-io GitHub organization. There are no first-party libraries for Python,
  PHP, Ruby, Go, Java or .NET — server-side users are pointed at POST /api/track
  directly.
