description: >-
  FinOps view of Rybbit spend. Rybbit has two cost models. Self-hosting the
  open-source (AGPL-3.0) edition shifts cost to infrastructure (compute,
  ClickHouse storage, bandwidth) with no per-event licensing. Rybbit Cloud
  is usage-based, metered primarily by monthly pageviews (an event is a
  pageview or custom event), billed as a monthly subscription whose price
  scales with the included pageview allowance across the Free, Standard,
  Pro, and Enterprise plans.
notes: >-
  Cloud pricing scales with pageview volume via a slider on the Standard and
  Pro plans; verify current bracket prices on the Rybbit pricing page during
  reconciliation. Self-hosted cost is entirely infrastructure-side.
sources:
- https://rybbit.com/pricing
- https://rybbit.com/docs/self-host-vs-cloud
