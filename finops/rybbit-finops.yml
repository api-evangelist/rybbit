meters:
- name: monthly_pageviews
  description: Pageviews ingested per month; the primary metered unit on Rybbit Cloud plans.
  unit: pageviews
  aggregation: sum
  dimensions:
  - account
  - site
- name: custom_events
  description: Custom events ingested per month; counted toward the monthly event allowance.
  unit: events
  aggregation: sum
  dimensions:
  - account
  - site
- name: data_retention
  description: Length of historical data retained, which varies by plan (6 months to infinite).
  unit: months
  aggregation: max
  dimensions:
  - account
  - plan
- name: self_hosted_infrastructure
  description: Compute, ClickHouse storage, and bandwidth costs for self-hosted (AGPL-3.0) deployments.
  unit: infrastructure
  aggregation: sum
  dimensions:
  - account
  - resource
principles:
- name: Visibility
  description: Track monthly pageview/event volume per site against the plan allowance to anticipate slider-driven price changes.
- name: Allocation
  description: Map sites and team members to internal teams; on cloud, allocate the subscription across the sites it covers.
- name: Optimization
  description: Self-host the AGPL-3.0 edition to trade subscription cost for controlled infrastructure cost; right-size data retention to plan needs; filter bots to avoid wasted pageview volume.
- name: Accountability
  description: Assign an owner per site/organization and review pageview burn and plan bracket monthly.
