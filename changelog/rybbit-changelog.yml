prior_breaking_change:
  version: v1.0
  guide: https://rybbit.com/docs/v1-migration
  summary: >-
    The backend began expecting the /api/ prefix intact; custom reverse proxies
    had to drop their path-rewrite rules. Affects self-hosters only.
