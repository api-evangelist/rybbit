name: Rybbit
kind: company
description: Rybbit is an open-source, privacy-friendly web and product analytics
  platform positioned as a cookieless alternative to Google Analytics and Plausible.
  It ingests pageviews, custom events, autocaptured interactions, performance samples
  and JavaScript errors through a lightweight tracking script and an HTTP /api/track
  endpoint, and exposes a Bearer-key-authenticated Stats and Management API covering
  sites, sessions, users, goals, funnels, web vitals, session replays, organizations
  and teams. Since v2.8.0 Rybbit also runs a first-party hosted Model Context Protocol
  server at https://app.rybbit.io/api/mcp — 38 tools behind an OAuth 2.1 authorization
  server with PKCE, dynamic client registration and a 29-scope resource:action
  permission model — making it directly callable by AI agents. Rybbit publishes no
  OpenAPI. It can be self-hosted under AGPL-3.0, which ships the identical REST and
  MCP surface, or consumed as a managed cloud service.
