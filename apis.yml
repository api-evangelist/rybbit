name: Rybbit
kind: company
description: Rybbit is an open-source, privacy-friendly web and product analytics
  platform positioned as a cookieless alternative to Google Analytics and Plausible.
  It ingests pageviews and custom events through a lightweight tracking script and
  HTTP /api/track endpoint, and exposes a Bearer-key-authenticated Stats API for
  sites, sessions, users, retention, and events. Rybbit can be self-hosted under
  AGPL-3.0 or consumed as a managed cloud service.
