  description: Public ingestion endpoint (POST /api/track) used by the Rybbit
    tracking script and server-side integrations to send pageviews, custom events,
    and outbound link events. Accepts site_id, event type, page context, and a
    JSON properties payload; no API key is required for basic tracking.
