description: >-
  Results of probing the /.well-known/ discovery surface for every host in
  apis.yml (baseURL host app.rybbit.io, Website www.rybbit.io) and the docs
  host rybbit.com. Status is the HTTP code observed at fetch time. The API
  host app.rybbit.io serves three real machine-readable documents — RFC 8414
  OAuth authorization-server metadata, an OIDC discovery document, and RFC
  9728 protected-resource metadata for Rybbit's hosted MCP endpoint. The
  marketing/docs hosts (rybbit.io, www.rybbit.io, rybbit.com) return the
  Next.js 404 shell for every /.well-known/ path; those are recorded as
  misses, not documents.
hosts:
